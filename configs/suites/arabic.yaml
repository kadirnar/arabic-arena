# Arabic STT benchmark suite (v1).
#
# Every set is a deterministic subset of a public Hugging Face dataset: rows are filtered
# (1-30 s, non-empty reference), then ranked by sha256(source_id) and the first `n` are kept.
# Degraded tracks (noisy / telephony / callcenter) re-use the first `n` of a clean set and are
# generated with seeded, recorded parameters (see sttarena/degrade).
#
# redistribute: whether the built subset may be re-hosted on the HF Hub
# (false -> only the manifest is published; build it locally with scripts/build_benchmark.py).

language: ar
hf_repo: kadirnar/arabic-arena-ar

datasets:
  fleurs_ar:
    source: google/fleurs
    config: ar_eg
    split: test
    text: raw_transcription
    n: 1000
    track: clean
    dialect: MSA
    domain: read
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: id}  # 428 clips of 283 sentences: a sentence read twice is one cluster

  cv18_ar:
    source: MohamedRashad/common-voice-18-arabic
    split: test
    text: sentence
    n: 1000
    track: clean
    dialect: MSA
    domain: read (crowd-sourced)
    license: CC0-1.0
    redistribute: true
    cluster: {field: client_id}  # speaker
    terms_file: configs/terms/cv18_ar_entities.json  # named entities of 233 rows (CV18-NER): term recall

  masc_clean:
    source: MohamedRashad/MASC-Arabic
    split: test
    text: text
    filter: {type: c}
    n: 1000
    track: clean
    dialect: mixed
    domain: youtube
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: video_id}

  mgb2:
    source: MohamedRashad/mgb2-arabic
    split: test
    text: transcript
    n: 1000
    track: clean
    dialect: MSA (mostly)
    domain: broadcast news
    license: QCRI MGB-2 agreement
    redistribute: false
    # The mirror matches the official QCRI/mgb2 test set segment for segment; 6 references whose
    # English words were garbled in the mirror are restored from the official transcripts.
    text_fixes: configs/fixes/mgb2_refs.json
    cluster: {field: recording_id}  # 1,000 rows from 17 recordings

  sada:
    source: MohamedRashad/SADA22
    split: test
    text: cleaned_text
    n: 1000
    track: clean
    dialect: Gulf (Saudi)
    domain: tv shows
    license: CC-BY-NC-SA-4.0
    redistribute: true
    # no show or episode column in the mirror, so the bootstrap cannot cluster SADA (CIs too narrow)

  casablanca:
    source: UBC-NLP/Casablanca
    configs: [Algeria, Egypt, Jordan, Mauritania, Morocco, Palestine, UAE, Yemen]
    split: test
    text: transcription
    n: 1000  # split evenly across configs
    track: clean
    dialect: 8 dialects
    domain: tv series
    license: CC-BY-NC-ND-4.0
    redistribute: false
    stratum: {field: source_config}  # country

  mgb3_egy:
    source: ArabicSpeech/MGB-3
    data_files: data/test.parquet
    split: train  # a single parquet file loads as "train"
    text: text_annotater_1
    n: 1000
    track: clean
    dialect: Egyptian
    domain: youtube
    license: unspecified
    redistribute: false
    # four independent transcriptions per segment: scored as multi-reference (annotator 1 is the
    # stored text, 2-4 come from meta); humans disagree on 13 % of words here
    references: [text_annotater_2, text_annotater_3, text_annotater_4]
    cluster: {field: id, regex: '^(.*)_[0-9.]+_[0-9.]+$'}  # programme
    # human floor: v1 = annotators 2-4 scored against annotator 1 on these 1,000 ids; L2sp = one
    # annotator against the other three (multi-reference, L2) on these ids, as the set is scored
    floor: {v1: 0.1365, L2sp: 0.0348, source: "MGB-3 inter-annotator study (sttarena audit floor), 2026-10-18"}

  mgb5_mor:
    source: ArabicSpeech/MGB-5
    split: test
    text: text
    n: 1000
    track: clean
    dialect: Moroccan (Darija)
    domain: youtube
    license: unspecified
    redistribute: false
    # The HF test split holds every recording four times, one segmentation per annotator: the v1 subset
    # scored the same speech 2-3 times (492 of 1,000 rows overlapped another annotator's row). v2 keeps
    # one segmentation per recording and scores it against the other annotators' overlapping text
    # (multi-reference); tag-only segments (@@@فراغ) go to the non-speech evaluation instead.
    multi_annotator:
      field: id
      regex: '^(?P<rec>.*)_annotator_(?P<ann>\d+)_(?P<start>[0-9.]+)_(?P<end>[0-9.]+)$'
      min_overlap: 0.5
    references: [alt_ref_1, alt_ref_2, alt_ref_3]
    cluster: {field: id, regex: '^(.*)_annotator_'}  # 14 recordings
    # human floor: v1 = annotator pairs at recording level (MGB-5 paper: ~45 %); L2sp = the pivot
    # annotator scored against the other annotators' overlapping segments, as the v2 set is scored
    floor: {v1: 0.4586, L2sp: 0.2286, source: "MGB-5 inter-annotator study, 2026-10-18"}

  # ---- code-switching -------------------------------------------------------------------
  mixat_cs:
    source: sqrk/mixat-tri
    split: test
    text: transcript
    unbracket: true  # English inside [...] is speech, not an annotation
    n: 1000
    track: codeswitch
    dialect: Emirati + English
    domain: podcast
    license: CC-BY-NC-SA-4.0
    redistribute: true
    # the same utterance with English written in Arabic script: a second reference
    references: [transliteration]

  algerian_cs:
    source: oist/algerian-code-switched-asr-eval
    split: test
    text: transcription
    n: 1000
    track: codeswitch
    dialect: Algerian + French
    domain: conversational
    license: controlled-access terms
    redistribute: false
    cluster: {field: video}  # 8 videos
    stratum: {field: type}  # MSA / DI / MSA-DI / FR / CS

  # ---- real noisy speech ----------------------------------------------------------------
  masc_noisy:
    source: MohamedRashad/MASC-Arabic
    split: test
    text: text
    filter: {type: n}
    n: 1000
    track: noisy
    dialect: mixed
    domain: youtube (noisy)
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: video_id}

  # NADI-2026 1.1 is Casablanca audio "downsampled to 4 kHz and then resampled up to 16 kHz, to mimic
  # extremely low bandwidth connections" (arXiv 2609.27086): band-limited, not real noise.
  nadi_robust:
    source: UBC-NLP/NADI2026_subtask1.1_Robust_ASR
    configs: [Algeria, Egypt, Jordan, Mauritania, Morocco, Palestine, UAE, Yemen]
    split: validation
    text: transcription
    n: 1000
    track: noisy
    dialect: 8 dialects
    domain: band-limited (4 kHz) TV series
    license: unspecified
    redistribute: false
    simulated: true
    stratum: {field: source_config}  # country

  # ---- added 2026-10-20: real phone noise and more dialects (docs/RESEARCH.md section 9) ----------------
  # Google SVQ: spoken queries read on phones by 215 speakers with Egyptian, Gulf, Levantine and Maghrebi
  # accents, each environment a separate recording. The clean environment joins the clean track; the
  # noisy environments are real (not added) noise, which the noisy track otherwise lacks.
  svq_ar:
    source: google/svq
    data_files: 1.0.0/audio/utts_ar_*_clean.parquet
    split: train
    text: text
    n: 1000
    track: clean
    dialect: Egyptian, Gulf, Levantine, Maghrebi accents
    domain: spoken queries on phones
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: speaker_id}
    stratum: {field: locale}
    terms: topk_salient_terms  # 3 salient terms per query: term recall next to WER
    text_fixes: configs/fixes/svq_ar_truth.json  # 2.0.0 transcript_truth where speakers said it differently
  svq_ar_noisy:
    source: google/svq
    data_files: 1.0.0/audio/utts_ar_*.parquet
    filter: {environment: [background_speech, media_noise, traffic_noise]}
    split: train
    text: text
    n: 1000
    track: noisy
    dialect: Egyptian, Gulf, Levantine, Maghrebi accents
    domain: spoken queries on phones in real background speech, media and traffic noise
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: speaker_id}
    stratum: {field: environment}
    terms: topk_salient_terms
    text_fixes: configs/fixes/svq_ar_truth.json
  # Shams: Levantine with corrected orthography. Only its LangMedia rows (CC BY-SA 4.0): the
  # Casablanca-linked rows repeat utterances of our casablanca set.
  shams_lev:
    source: shams-nlp/shams
    split: test
    text: transcription
    filter: {source: langmedia}
    n: 1000
    track: clean
    dialect: Levantine (Lebanon, Syria, Palestine, Jordan)
    domain: conversations and interviews (LangMedia)
    license: CC-BY-SA-4.0
    redistribute: true
    cluster: {field: original_file}  # 100 recordings
    stratum: {field: country}
  # Hassaniya (Mauritanian Arabic): YouTube programmes, model drafts corrected by native transcribers.
  hassaniya:
    source: MauriAI-lab/hassaniya-speech-test-v1
    manifest: test.jsonl
    audio_field: file
    split: test
    text: text
    n: 1000
    track: clean
    dialect: Hassaniya (Mauritania)
    domain: youtube
    license: CC-BY-NC-4.0
    redistribute: true
    cluster: {field: video_id}
  # WASIL: spoken prompts to a chat assistant, in-the-wild, with gold transcriptions; the 31 English prompts
  # are left out (and one row whose dialect label carries trailing spaces).
  wasil:
    source: QCRI/WASIL
    manifest: WASIL/test/metadata.jsonl
    split: test
    text: prompt_transcription.gold_transcription
    filter: {prompt_dialect: [MSA, EG, SD, DZ, MIX_EG, SY, MIX_MSA, MIX, MIX_SD, MIX_SY]}
    n: 1000
    track: clean
    dialect: MSA, Egyptian, Sudanese, Algerian, Syrian
    domain: spoken prompts to a chat assistant
    license: CC-BY-NC-SA-4.0
    redistribute: true
    stratum: {field: prompt_dialect}
  # Perle: Egyptian- and Saudi-Arabic code-switching with dense English (Latin script); human-annotated references.
  perle_cs:
    source: Perle-ai/ASR_Code_Switch
    manifest: data/{config}/metadata.jsonl
    configs: [egyptian_arabic_english, saudi_arabic_english]
    split: test
    text: transcript
    n: 600
    track: codeswitch
    dialect: Egyptian and Saudi Arabic with English
    domain: code-switched work and social speech
    license: MIT
    redistribute: true
    stratum: {field: language_pair}
  # EchoNova Arabic Dialect Benchmark (gated public subset): MSA and eight dialects, the only human-referenced
  # Kuwaiti, Qatari and Omani speech we know of. Audio for research and evaluation only: never re-hosted.
  echonova:
    source: echonova-ai/arabic-dialect-asr-benchmark
    split: test
    text: text
    n: 1000
    track: clean
    dialect: MSA, Egyptian, Emirati, Saudi, Kuwaiti, Qatari, Omani, Syrian, Lebanese
    domain: public recordings
    license: transcripts CC-BY-4.0; audio research and evaluation only
    redistribute: false
    balance: dialect  # ~111 per variety: as many Omani or Qatari rows as MSA
    cluster: {field: recording_id}
    stratum: {field: dialect}

  # Speech-MASSIVE (ar-SA test): voice-assistant commands read by speakers from across the Arab world and
  # validated by crowd workers; unvalidated or reported recordings left out.
  massive_ar:
    source: FBK-MT/Speech-MASSIVE-test
    config: ar-SA
    split: test
    text: utt
    filter: {is_validated: true, is_transcript_reported: false}
    n: 1000
    track: clean
    dialect: MSA and Gulf prompts, speakers from across the Arab world
    domain: voice-assistant commands
    license: CC-BY-NC-SA-4.0
    redistribute: true
    cluster: {field: speaker_id}
    stratum: {field: scenario_str}
  # TEDxTN test (the KBayoud/ASR_TEDx_Tunisie mirror carries its audio): Tunisian Arabic with French.
  tedxtn_cs:
    source: KBayoud/ASR_TEDx_Tunisie
    split: test
    text: transcription
    n: 1000
    track: codeswitch
    dialect: Tunisian with French
    domain: TEDx talks
    license: CC-BY-NC-ND-4.0
    redistribute: false
    cluster: {field: youtube_video}
  # Sudanese dialect speech (Zenodo 6721683 via arbml): two TV programmes, one transcriber; no test split exists.
  # Not weighted in the v2 Arena since 2026-10-28 (scoring.v2.set_tracks): in 959 of the 1,000 rows the reference
  # belongs to the clip one or two rows earlier in the source.
  sudanese_sdn:
    source: arbml/sudanese_dialect_speech
    split: train
    text: text
    n: 1000
    track: clean
    dialect: Sudanese
    domain: TV programmes
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: path, regex: '.*/((?:hm|wb)_\d+)_'}  # episode (re.match: from the start of the path)
  # mTEDx Arabic test: TEDx talks, mostly MSA; 7 talks only, and its train split is public.
  # Not weighted in the v2 Arena since 2026-10-28 (scoring.v2.set_tracks): the references are subtitles edited
  # towards MSA, not verbatim transcripts (every model is above 61 % WER).
  mtedx_ar:
    source: deepdml/mtedx
    config: ar
    split: test
    text: transcript
    n: 1000
    track: clean
    dialect: mostly MSA
    domain: TEDx talks
    license: CC-BY-NC-ND-4.0
    redistribute: false
    cluster: {field: talk_id}
    markup_extra: [{pattern: '\((?:تصفيق|ضحك|موسيقى)[^)]*\)', repl: ' '}]
  # GigaSpeechBench (low-resource Arabic): YouTube 2025-26, professionally transcribed, ~20 h per region. The
  # Emirati (ARE) region is left out: GPT-4o-transcribe matches its references exactly on 58 % of segments
  # (4-18 % elsewhere), so they were very likely drafted with it.
  gsb_ar:
    source: speechcolab/GigaSpeechBench
    loader: gigaspeechbench
    data_dir: Low-Resource-Languages/data
    configs: [DZA, EGY, IRQ, MAR, SAU, SYR]
    split: test
    text: text
    n: 1000
    track: clean
    dialect: Algerian, Egyptian, Iraqi, Moroccan, Saudi, Syrian
    domain: youtube (2025-26)
    license: unspecified (CC-licensed YouTube audio per the paper)
    redistribute: false
    cluster: {field: aid}  # recording
    stratum: {field: source_config}  # region

# Noise-only clips for the hallucination metric (scripts/build_hallucination_set.py). v1 (data/ar/noise_only,
# 300 clips) is the published set; v2 (--version 2 -> data/ar/noise_only_v2) has groups G1-G3, G5, G7 and
# non-target speech NT, with meta.group / meta.kind (sttarena/degrade/nonspeech.py).
hallucination:
  v2:
    n: 830
    # talkers for babble_v2 and speech-shaped noise, disjoint from every test set (sttarena/degrade/pool.py)
    babble_pool: &babble_pool
      source: MohamedRashad/common-voice-18-arabic
      split: train  # Common Voice splits are speaker-disjoint; cv18_ar speakers and sentences are dropped too
      max_files: 1  # first parquet shard only (346 MB)
      speaker: client_id
      text: sentence
      n: 600
      per_speaker: 3

# Simulated acoustic conditions built from the clean sets above.
degraded:
  noisy:
    from: [fleurs_ar, cv18_ar, mgb2, sada]
    n: 300
  telephony:
    from: [fleurs_ar, cv18_ar, mgb2, sada, casablanca, mgb3_egy]
    n: 300
  callcenter:
    from: [fleurs_ar, cv18_ar, mgb2, sada, casablanca, mgb3_egy]
    n: 300
  # ---- degradation chain v2 (sttarena/degrade/chain_v2.py): telephony_v2 and callcenter_v2 are the v2 Arena's
  # phone tracks (scoring.v2.condition_tracks); sweep and padded are reported per group --------------------
  # `version: 2` builds with chain v2 (default 1: the published sets above; AMR-NB and Opus rows depend on the
  # ffmpeg build, see METHODOLOGY); `chain` names the v2 chain; `group_by` makes the runner score each value of
  # these meta.degradation fields separately.
  telephony_v2:  # device x network x storage profiles: MENA codec mix, tandem to G.711 A-law, wideband paths
    version: 2
    chain: telephony
    from: [fleurs_ar, cv18_ar, mgb2, sada, casablanca, mgb3_egy]
    n: 300
    group_by: [network]
  callcenter_v2:  # caller-side room IR and environment noise (babble_v2 0.15), then telephony v2
    version: 2
    chain: callcenter
    from: [fleurs_ar, cv18_ar, mgb2, sada, casablanca, mgb3_egy]
    n: 300
    group_by: [noise]
    babble_pool: *babble_pool
  sweep:  # paired SNR grid, rows "<clean id>#<noise>@<snr>": 150 x 3 noises x 5 SNRs = 2,250 per set
    version: 2
    chain: sweep
    from: [fleurs_ar, masc_clean]  # MSA read + mixed dialects, both redistributable
    n: 150
    noises: [ssn, babble_v2, ambient]  # speech-shaped stationary, unintelligible babble, a noise-bank ambience
    ambient: [cafe, street, transport]
    snrs: [20, 10, 5, 0, -5]
    group_by: [noise, snr_db]
    babble_pool: *babble_pool
  padded:  # hallucination inside speech, rows "<clean id>#pad" paired with the clean rows
    version: 2
    chain: padded
    from: [fleurs_ar, cv18_ar, masc_clean, sada]
    n: 100
    positions: [lead, trail, both]
    pad_s: [2, 8, 20]
    fillers: {silence: 0.25, comfort_noise: 0.25, tones: 0.25, office: 0.25}
    max_total_s: 30  # stays inside a 30 s model window

# Leaderboard aggregation: each track is the macro-average WER over its sets; the v1 Arena is a
# weighted mean of track scores, the v2 Arena a weighted geometric mean of set scores (below).
scoring:
  # v2: per-set score = profile `headline` (sttarena/scoring.py): L2 dialect-lenient normalization,
  # space-insensitive alignment, multi-reference where a set has several transcriptions, and every
  # utterance's errors capped at its reference length. Arena = weighted geometric mean of the set
  # scores (track weight split evenly over the track's sets); the arithmetic mean is shown next to it.
  version: 2
  headline: L2sp
  aggregate: geometric
  tracks:  # v1 Arena: the published v1 board (unchanged)
    clean: {weight: 0.35}
    noisy: {weight: 0.15}
    codeswitch: {weight: 0.1}
    telephony: {weight: 0.2}
    callcenter: {weight: 0.2}
  # v2 Arena (docs/RESEARCH.md, section 11): the simulated channels are unvalidated (in English they add no
  # ranking information about real calls beyond clean speech), so telephony and call-center weigh 10 % each
  # instead of 20 %, and the freed 20 % goes to real recordings (clean +15, code-switching +5). Simulated
  # audio falls from 52.5 % to 32 % of the Arena. nadi_robust is Casablanca audio band-limited to 4 kHz
  # (simulated, partly the same utterances as `casablanca`): it is scored as a diagnostic, outside the Arena.
  # sudanese_sdn and mtedx_ar are diagnostics too since 2026-10-28: their references do not match the audio
  # verbatim (README, Datasets). The v1 board keeps both.
  v2:
    tracks:
      clean: {weight: 0.5}
      codeswitch: {weight: 0.15}
      noisy: {weight: 0.15}
      telephony: {weight: 0.1}
      callcenter: {weight: 0.1}
    # clean-condition track moves; a track without a weight is not in the Arena
    set_tracks: {nadi_robust: bandlimited, sudanese_sdn: unreliable_refs, mtedx_ar: unreliable_refs}
    # Since 2026-10-20 (every ranked model has results on them) the v2 Arena's phone tracks take the chain-v2
    # conditions; the v1 chain moves to unweighted tracks. The v1 board keeps the v1 chain.
    condition_tracks: {telephony: telephony_v1, callcenter: callcenter_v1, telephony_v2: telephony,
                       callcenter_v2: callcenter}
