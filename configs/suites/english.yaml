# English STT benchmark suite (v1). Same construction rules as arabic.yaml.
# TED-LIUM is intentionally absent (taken down upstream for copyright reasons).

language: en
hf_repo: kadirnar/arabic-arena-en

datasets:
  librispeech_clean:
    source: openslr/librispeech_asr
    config: clean
    split: test
    text: text
    n: 1000
    track: clean
    dialect: US/UK read
    domain: audiobooks
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: speaker_id}  # 40 speakers

  librispeech_other:
    source: openslr/librispeech_asr
    config: other
    split: test
    text: text
    n: 1000
    track: clean
    dialect: US/UK read (hard)
    domain: audiobooks
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: speaker_id}  # 33 speakers

  fleurs_en:
    source: google/fleurs
    config: en_us
    split: test
    text: raw_transcription
    n: 1000
    track: clean
    dialect: various
    domain: read wikipedia
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: id}  # sentence: 647 clips of 350 sentences, a sentence read twice is one cluster

  common_voice_en:
    source: hf-audio/open-asr-leaderboard
    config: common_voice
    split: test
    text: text
    n: 1000
    track: clean
    dialect: global accents
    domain: read (crowd-sourced)
    license: CC0-1.0
    redistribute: true
    cluster: {field: id}  # the mirror's id is Common Voice's client_id (128-hex speaker hash): 974 speakers

  voxpopuli_en:
    source: hf-audio/open-asr-leaderboard
    config: voxpopuli
    split: test
    text: text
    n: 1000
    track: clean
    dialect: European accents
    domain: parliament
    license: CC0-1.0
    redistribute: true
    cluster: {field: id, regex: '^(.*?)_'}  # session item (one plenary recording): 400

  earnings22:
    source: hf-audio/open-asr-leaderboard
    config: earnings22
    split: test
    text: text
    n: 1000
    track: clean
    dialect: global accents
    domain: earnings calls
    license: CC-BY-SA-4.0
    redistribute: true
    cluster: {field: id, regex: '^([^/]+)/'}  # call: 1,000 rows from 6 calls

  gigaspeech:
    source: hf-audio/open-asr-leaderboard
    config: gigaspeech
    split: test
    text: text
    max_files: 3
    n: 1000
    track: clean
    dialect: US
    domain: podcasts / youtube
    license: GigaSpeech terms
    redistribute: false
    cluster: {field: id, regex: '^([A-Z]+\d+)_'}  # podcast / video / audiobook file: 94

  spgispeech:
    source: hf-audio/open-asr-leaderboard
    config: spgispeech
    split: test
    text: text
    max_files: 2
    n: 1000
    track: clean
    dialect: US
    domain: finance calls
    license: Kensho SPGISpeech terms
    redistribute: false
    cluster: {field: id, regex: '^([^/]+)/'}  # call: 565

  ami_sdm:
    source: hf-audio/open-asr-leaderboard
    config: ami
    split: test
    text: text
    n: 1000
    track: clean
    dialect: various
    domain: meetings
    license: CC-BY-4.0
    redistribute: true
    cluster: {field: id, regex: '^AMI_([A-Z]+\d+[a-z])_'}  # meeting: 16

  edacc:
    source: edinburghcstr/edacc
    split: test
    text: text
    n: 1000
    track: accented
    dialect: 40+ accents
    domain: conversation
    license: CC-BY-SA-4.0
    redistribute: true
    cluster: {field: speaker, regex: '^(EDACC-C\d+)'}  # conversation (two speakers): 30

  urgent2024:
    source: hf-audio/open-asr-leaderboard
    config: urgent2024
    split: test
    text: text
    n: 1000
    track: noisy
    dialect: various
    domain: noisy (-5..20 dB)
    license: mixed
    redistribute: false
    # no speaker or recording column in the mirror (fileid_N), so the bootstrap cannot cluster it

  # ---- real telephone speech ------------------------------------------------------------
  minds14_tel:
    source: BrunoHays/minds14-telephony-en-us
    split: test
    text: transcription
    n: 1000
    track: telephony
    dialect: US
    domain: banking IVR calls (8 kHz)
    license: CC-BY-4.0
    redistribute: true
    # no caller column (one clip per call, callers unknown), so the bootstrap cannot cluster it

  vystadial_voip:
    source: BrunoHays/vystadial-telephony-en
    split: test
    text: transcription
    n: 1000
    track: telephony
    dialect: various
    domain: VoIP dialogue system
    license: CC-BY-SA-3.0
    redistribute: true
    cluster: {field: audio_id, regex: '^vystadial-telephony-en_(.*_\d{6}_\d{6})_\d+_\d+$'}  # call: one utterance per call

# Noise-only clips for the hallucination metric (scripts/build_hallucination_set.py). v1 (data/en/noise_only,
# 300 clips) is the published set; v2 (--version 2 -> data/en/noise_only_v2) has groups G1-G3, G5, G7 and
# non-target speech NT, with meta.group / meta.kind (sttarena/degrade/nonspeech.py).
hallucination:
  v2:
    n: 830
    # talkers for babble_v2 and speech-shaped noise, disjoint from every test set (sttarena/degrade/pool.py)
    babble_pool: &babble_pool
      source: openslr/librispeech_asr
      config: clean
      split: train.100  # speaker-disjoint from the LibriSpeech test sets
      max_files: 1  # first parquet shard only (470 MB)
      speaker: speaker_id
      text: text
      n: 600
      per_speaker: 3

degraded:
  noisy:
    from: [librispeech_clean, fleurs_en, voxpopuli_en, earnings22]
    n: 300
  telephony:
    from: [librispeech_clean, fleurs_en, voxpopuli_en, earnings22, common_voice_en, gigaspeech]
    n: 300
  callcenter:
    from: [librispeech_clean, fleurs_en, voxpopuli_en, earnings22, common_voice_en, gigaspeech]
    n: 300
  # ---- degradation chain v2 (sttarena/degrade/chain_v2.py): new conditions, not in the Arena score ------
  # `version: 2` builds with chain v2 (default 1: the published sets above, rebuilt bit-for-bit); `chain` names
  # the v2 chain; `group_by` makes the runner score each value of these meta.degradation fields separately.
  telephony_v2:  # device x network x storage profiles: MENA codec mix, tandem to G.711 A-law, wideband paths
    version: 2
    chain: telephony
    from: [librispeech_clean, fleurs_en, voxpopuli_en, earnings22, common_voice_en, gigaspeech]
    n: 300
    group_by: [network]
  callcenter_v2:  # caller-side room IR and environment noise (babble_v2 0.15), then telephony v2
    version: 2
    chain: callcenter
    from: [librispeech_clean, fleurs_en, voxpopuli_en, earnings22, common_voice_en, gigaspeech]
    n: 300
    group_by: [noise]
    babble_pool: *babble_pool
  sweep:  # paired SNR grid, rows "<clean id>#<noise>@<snr>": 150 x 3 noises x 5 SNRs = 2,250 per set
    version: 2
    chain: sweep
    from: [librispeech_clean, fleurs_en]  # read audiobooks + read Wikipedia
    n: 150
    noises: [ssn, babble_v2, ambient]  # speech-shaped stationary, unintelligible babble, a noise-bank ambience
    ambient: [cafe, street, transport]
    snrs: [20, 10, 5, 0, -5]
    group_by: [noise, snr_db]
    babble_pool: *babble_pool
  padded:  # hallucination inside speech, rows "<clean id>#pad" paired with the clean rows
    version: 2
    chain: padded
    from: [librispeech_clean, fleurs_en, voxpopuli_en, common_voice_en]
    n: 100
    positions: [lead, trail, both]
    pad_s: [2, 8, 20]
    fillers: {silence: 0.25, comfort_noise: 0.25, tones: 0.25, office: 0.25}
    max_total_s: 30  # stays inside a 30 s model window

scoring:
  tracks:
    clean: {weight: 0.35}
    accented: {weight: 0.05}
    noisy: {weight: 0.15}
    telephony: {weight: 0.225}
    callcenter: {weight: 0.225}
